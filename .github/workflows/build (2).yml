# GRAM Update — ملف واحد يبني كل شي: الصفحة + الأيقونة + التطبيق + الويدجت
name: GRAM Update

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gram-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Create all files
        run: |
          rm -rf src site
          mkdir -p site
          base64 -d > site/logo.png << 'EOF'
