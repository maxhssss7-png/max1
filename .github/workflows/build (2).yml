          cp site/logo.png src/main/res/drawable-nodpi/logo_badge.png

          cat > src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
              <monochrome android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF

          cat > src/main/res/values/colors.xml << 'EOF'
          <resources>
              <color name="icon_bg">#30A1F5</color>
          </resources>
          EOF

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'TonPrice'
          EOF

          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.5.2' }
          android {
              namespace 'com.ton.price'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.ton.price'
                  minSdk 24
                  targetSdk 34
                  versionCode 7
                  versionName '7.0'
              }
          }
          EOF

          cat > src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="GRAM Update"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".PriceWidget" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF


          cat > src/main/res/drawable/widget_bg.xml << 'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <gradient android:angle="270" android:startColor="#131D33" android:endColor="#070B14" />
                      <corners android:radius="28dp" />
                      <stroke android:width="1dp" android:color="#1E2A44" />
                  </shape>
              </item>
          </layer-list>
          EOF

          cat > src/main/res/drawable/pill_up.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#262FD58B" />
              <corners android:radius="99dp" />
          </shape>
          EOF

          cat > src/main/res/drawable/pill_down.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#26FF5C6C" />
              <corners android:radius="99dp" />
          </shape>
          EOF

          cat > src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="widget_desc">سعر GRAM المباشر من Binance</string>
          </resources>
          EOF

          cat > src/main/res/layout/widget.xml << 'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:paddingLeft="18dp"
              android:paddingRight="18dp"
              android:paddingTop="16dp"
              android:paddingBottom="14dp"
              android:layoutDirection="ltr"
              android:background="@drawable/widget_bg">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical">
                  <ImageView
                      android:id="@+id/logo"
                      android:layout_width="30dp"
                      android:layout_height="30dp"
                      android:src="@drawable/logo_badge" />
                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:layout_marginStart="10dp"
                      android:orientation="vertical">
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="GRAM"
                          android:textColor="#EEF3FB"
                          android:textSize="15sp"
                          android:fontFamily="sans-serif-medium"
                          android:letterSpacing="0.04" />
                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="USDT · Binance"
                          android:textColor="#7D8BA5"
                          android:textSize="10sp" />
                  </LinearLayout>
                  <TextView
                      android:id="@+id/pill"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:background="@drawable/pill_up"
                      android:paddingLeft="10dp"
                      android:paddingRight="10dp"
                      android:paddingTop="4dp"
                      android:paddingBottom="4dp"
                      android:text="—"
                      android:textColor="#2FD58B"
                      android:textSize="12sp"
                      android:fontFamily="sans-serif-medium"
                      android:fontFeatureSettings="tnum" />
              </LinearLayout>

              <TextView
                  android:id="@+id/price"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:text="$—"
                  android:textColor="#EEF3FB"
                  android:textSize="34sp"
