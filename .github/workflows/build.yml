          cp site/logo.png src/main/res/drawable-nodpi/logo_badge.png
          pip install --quiet pillow
          python3 - << 'EOF'
          from PIL import Image, ImageDraw
          b = Image.open("site/logo.png").convert("RGBA")
          w, h = b.size
          px = b.load()
          pts = [(x, y) for y in range(h) for x in range(w) if px[x, y][0] > 200 and px[x, y][3] > 200]
          x0 = min(p[0] for p in pts) - 2; x1 = max(p[0] for p in pts) + 3
          y0 = min(p[1] for p in pts) - 2; y1 = max(p[1] for p in pts) + 3
          c = b.crop((x0, y0, x1, y1))
          d = Image.new("RGBA", c.size)
          for y in range(c.height):
              for x in range(c.width):
                  r, g, bl, a = c.getpixel((x, y))
                  al = max(0.0, min(1.0, (r - 48) / 207.0)) * a / 255.0
                  d.putpixel((x, y), (255, 255, 255, int(round(al * 255))))
          W, tw = 432, 184
          th = round(d.height * tw / d.width)
          d = d.resize((tw, th), Image.LANCZOS)
          fg = Image.new("RGBA", (W, W), (0, 0, 0, 0))
          fg.paste(d, ((W - tw) // 2, (W - th) // 2), d)
          fg.save("src/main/res/drawable-nodpi/ic_fg.png")
          L = 192
          leg = Image.new("RGBA", (L, L), (0, 0, 0, 0))
          m = Image.new("L", (L, L), 0)
          ImageDraw.Draw(m).rounded_rectangle([0, 0, L - 1, L - 1], radius=44, fill=255)
          leg.paste(Image.new("RGBA", (L, L), (48, 161, 245, 255)), (0, 0), m)
          s = fg.resize((L * 432 // 288,) * 2, Image.LANCZOS)
          o = (s.width - L) // 2
          leg.alpha_composite(s.crop((o, o, o + L, o + L)))
          leg.save("src/main/res/mipmap/ic_launcher.png")
          EOF
          python3 - << 'EOF'
          import wave, struct, math, os
          os.makedirs("src/main/res/raw", exist_ok=True)
          def tone(path, notes):
              sr = 22050
              frames = []
              for f, dur in notes:
                  n = int(sr * dur)
                  for i in range(n):
                      t = i / sr
                      env = min(1.0, i / (sr * 0.008)) * math.exp(-t * 7.5)
                      v = env * (0.62 * math.sin(2 * math.pi * f * t) + 0.22 * math.sin(4 * math.pi * f * t) + 0.08 * math.sin(6 * math.pi * f * t))
                      frames.append(int(max(-1, min(1, v)) * 30000))
              frames += [0] * int(sr * 0.08)
              w = wave.open(path, "wb")
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              w.writeframes(b"".join(struct.pack("<h", x) for x in frames))
              w.close()
          tone("src/main/res/raw/snd_up.wav", [(659.25, 0.13), (783.99, 0.13), (1046.5, 0.42)])
          tone("src/main/res/raw/snd_down.wav", [(1046.5, 0.13), (783.99, 0.13), (523.25, 0.42)])
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::أضف SIGNING_KEY من Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 -d > key.jks

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon
          cp build/outputs/apk/debug/*.apk Price-Gram.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Price Gram 2.${{ github.run_number }}
          files: Price-Gram.apk
