          cat > src/main/java/com/ton/price/PriceWidget.java << 'EOF'
          package com.ton.price;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.Shader;
          import android.view.View;
          import android.widget.RemoteViews;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class PriceWidget extends AppWidgetProvider {
              static final String[] HOSTS = {"https://api.binance.com", "https://data-api.binance.vision"};
              static final String TICKER = "/api/v3/ticker/24hr?symbol=GRAMUSDT";
              static final String KLINES = "/api/v3/klines?symbol=GRAMUSDT&interval=30m&limit=48";
              static final String REFRESH = "com.ton.price.REFRESH";
              static final int UP = 0xFF12A865, DOWN = 0xFFD1293A, LINE = 0xFFFFFFFF;

              @Override
              public void onReceive(Context c, Intent i) {
                  String a = i.getAction();
                  if (AppWidgetManager.ACTION_APPWIDGET_UPDATE.equals(a) || REFRESH.equals(a)) {
                      if (AppWidgetManager.getInstance(c).getAppWidgetIds(new ComponentName(c, PriceWidget.class)).length == 0) {
                          onDisabled(c);
                          return;
                      }
                      schedule(c);
                      final PendingResult pr = goAsync();
                      final Context app = c.getApplicationContext();
                      new Thread(new Runnable() {
                          public void run() {
                              try { update(app); } finally { pr.finish(); }
                          }
                      }).start();
                  } else {
                      super.onReceive(c, i);
                  }
              }

              @Override
              public void onDisabled(Context c) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  if (am != null) am.cancel(tick(c));
              }

              static PendingIntent tick(Context c) {
                  Intent i = new Intent(c, PriceWidget.class).setAction(REFRESH);
                  return PendingIntent.getBroadcast(c, 2, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static void schedule(Context c) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  if (am == null) return;
                  long every = 60 * 1000L;
                  am.setRepeating(AlarmManager.RTC, System.currentTimeMillis() + every, every, tick(c));
              }

              static PendingIntent openApp(Context c) {
                  Intent oi = new Intent(c, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  return PendingIntent.getActivity(c, 1, oi, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static String get(String path) throws Exception {
                  Exception last = null;
                  for (String h : HOSTS) {
                      try {
                          HttpURLConnection con = (HttpURLConnection) new URL(h + path).openConnection();
                          con.setConnectTimeout(3500);
                          con.setReadTimeout(3500);
                          con.setUseCaches(false);
                          con.setRequestProperty("User-Agent", "GramUpdateApp");
                          if (con.getResponseCode() != 200) throw new Exception("HTTP " + con.getResponseCode());
                          BufferedReader r = new BufferedReader(new InputStreamReader(con.getInputStream(), "UTF-8"));
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = r.readLine()) != null) sb.append(line);
                          r.close();
                          return sb.toString();
                      } catch (Exception e) { last = e; }
                  }
                  throw last;
              }

              static String money(double v) {
                  return String.format(Locale.US, v < 10 ? "$%,.3f" : "$%,.2f", v);
              }

              static Bitmap spark(double[] d, int color) {
                  int w = 640, h = 160;
                  float px = 10f, py = 12f;
                  Bitmap b = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                  Canvas cv = new Canvas(b);
                  double min = d[0], max = d[0];
                  for (double v : d) { if (v < min) min = v; if (v > max) max = v; }
                  double rg = max - min;
                  if (rg == 0) rg = 1;
                  Path line = new Path();
                  float lx = 0, ly = 0;
                  for (int i = 0; i < d.length; i++) {
                      float x = px + (w - 2 * px) * i / (d.length - 1);
                      float y = (float) (py + (h - 2 * py) * (1 - (d[i] - min) / rg));
                      if (i == 0) line.moveTo(x, y); else line.lineTo(x, y);
                      lx = x; ly = y;
                  }
                  Path fill = new Path(line);
                  fill.lineTo(lx, h);
                  fill.lineTo(px, h);
                  fill.close();
                  Paint fp = new Paint(Paint.ANTI_ALIAS_FLAG);
                  fp.setShader(new LinearGradient(0, 0, 0, h, (color & 0x00FFFFFF) | 0x60000000,
                      color & 0x00FFFFFF, Shader.TileMode.CLAMP));
                  cv.drawPath(fill, fp);
                  Paint lp = new Paint(Paint.ANTI_ALIAS_FLAG);
                  lp.setStyle(Paint.Style.STROKE);
                  lp.setStrokeWidth(4f);
                  lp.setStrokeJoin(Paint.Join.ROUND);
                  lp.setStrokeCap(Paint.Cap.ROUND);
                  lp.setColor(color);
                  cv.drawPath(line, lp);
                  Paint dp = new Paint(Paint.ANTI_ALIAS_FLAG);
                  dp.setColor((color & 0x00FFFFFF) | 0x40000000);
                  cv.drawCircle(lx, ly, 10f, dp);
                  dp.setColor(0xFFFFFFFF);
                  cv.drawCircle(lx, ly, 6f, dp);
                  dp.setColor(0xFF1F6FDC);
                  cv.drawCircle(lx, ly, 3.5f, dp);
                  return b;
              }

              static void update(Context c) {
                  SharedPreferences sp = c.getSharedPreferences("w", Context.MODE_PRIVATE);
                  AppWidgetManager m = AppWidgetManager.getInstance(c);
                  ComponentName cn = new ComponentName(c, PriceWidget.class);
                  RemoteViews rv = new RemoteViews(c.getPackageName(), R.layout.widget);
                  rv.setOnClickPendingIntent(R.id.root, openApp(c));
                  try {
                      JSONObject o = new JSONObject(get(TICKER));
                      double p = Double.parseDouble(o.getString("lastPrice"));
                      double ch = Double.parseDouble(o.getString("priceChangePercent"));
                      double lo = Double.parseDouble(o.getString("lowPrice"));
                      double hi = Double.parseDouble(o.getString("highPrice"));
                      boolean up = ch >= 0;
                      int col = up ? UP : DOWN;
                      String now = new SimpleDateFormat("HH:mm", Locale.US).format(new Date());
                      sp.edit().putString("last", now).apply();

                      rv.setTextViewText(R.id.price, money(p));
                      rv.setTextViewText(R.id.pill, String.format(Locale.US, "%s %s%.2f%%", up ? "▲" : "▼", up ? "+" : "", ch));
                      rv.setTextColor(R.id.pill, col);
                      rv.setInt(R.id.pill, "setBackgroundResource", up ? R.drawable.pill_up : R.drawable.pill_down);
                      rv.setTextViewText(R.id.range, "↓ " + money(lo) + "    ↑ " + money(hi));
                      rv.setTextViewText(R.id.time, "● " + now);
                      rv.setTextColor(R.id.time, 0xFFD6E6FF);

                      try {
                          JSONArray k = new JSONArray(get(KLINES));
                          double[] d = new double[k.length()];
                          for (int i = 0; i < d.length; i++) d[i] = Double.parseDouble(k.getJSONArray(i).getString(4));
                          if (d.length > 1) {
                              rv.setImageViewBitmap(R.id.spark, spark(d, LINE));
                              rv.setViewVisibility(R.id.spark, View.VISIBLE);
                          }
                      } catch (Exception ignored) {}
                  } catch (Exception e) {
                      String last = sp.getString("last", null);
                      RemoteViews err = new RemoteViews(c.getPackageName(), R.layout.widget);
                      err.setTextViewText(R.id.time, last != null ? "⚠ " + last : "⚠");
                      err.setTextColor(R.id.time, 0xFFFFC7CD);
                      err.setOnClickPendingIntent(R.id.root, openApp(c));
                      m.partiallyUpdateAppWidget(m.getAppWidgetIds(cn), err);
                      return;
                  }
                  m.updateAppWidget(cn, rv);
              }
          }
          EOF

          cat > src/main/java/com/ton/price/MainActivity.java << 'EOF'
          package com.ton.price;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.ConnectivityManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              static final String URL = "https://maxhssss7-png.github.io/max1/ton.html";
              static final String OFFLINE = "<html dir='rtl'><body style='background:#1f6fdc;color:#fff;"
                  + "font-family:sans-serif;text-align:center;padding-top:40%'>"
                  + "<h2>لا يوجد اتصال بالإنترنت</h2>"
                  + "<button onclick=\"location.href='" + URL + "'\" style='background:#fff;color:#1f6fdc;"
                  + "border:0;border-radius:14px;padding:14px 32px;font-size:16px'>إعادة المحاولة</button>"
                  + "</body></html>";
              static final long SNOOZE = 3L * 24 * 60 * 60 * 1000;
              WebView web;
              AlertDialog dialog;
              final Handler handler = new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(0xFF2B95F2);
                  getWindow().setNavigationBarColor(0xFF1546B8);
                  web = new WebView(this);
                  web.setBackgroundColor(0xFF1F6FDC);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame()) v.loadDataWithBaseURL(URL, OFFLINE, "text/html", "UTF-8", null);
                      }
                  });
                  setContentView(web);
                  web.loadUrl(URL + "?v=" + System.currentTimeMillis());
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  try {
                      sendBroadcast(new Intent(this, PriceWidget.class).setAction(PriceWidget.REFRESH));
                  } catch (Exception ignored) {}
                  handler.postDelayed(new Runnable() {
                      public void run() {
                          try { askPermissions(); } catch (Exception ignored) {}
                      }
                  }, 1500);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  handler.removeCallbacksAndMessages(null);
              }

              SharedPreferences prefs() { return getSharedPreferences("perm", Context.MODE_PRIVATE); }

              boolean snoozed(String key) { return System.currentTimeMillis() < prefs().getLong(key, 0); }

              void snooze(String key) { prefs().edit().putLong(key, System.currentTimeMillis() + SNOOZE).apply(); }

              boolean batteryOk() {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      return pm == null || pm.isIgnoringBatteryOptimizations(getPackageName());
                  } catch (Exception e) {
                      return true;
                  }
              }

              boolean dataOk() {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      return cm == null || cm.getRestrictBackgroundStatus() != ConnectivityManager.RESTRICT_BACKGROUND_STATUS_ENABLED;
                  } catch (Exception e) {
                      return true;
                  }
              }

              void askPermissions() {
                  if (isFinishing() || (dialog != null && dialog.isShowing())) return;
                  if (!batteryOk() && !snoozed("battery")) {
                      show("تشغيل الويدجت بالخلفية",
                          "حتى يبقى سعر GRAM يتحدث على الشاشة الرئيسية، اسمح للتطبيق يشتغل بدون قيود البطارية.\n\nبالنافذة اللي تطلع اضغط «سماح».",
                          "battery", new Runnable() { public void run() { openBattery(); } });
                  } else if (!dataOk() && !snoozed("data")) {
                      show("استخدام البيانات بالخلفية",
                          "وضع توفير البيانات مفعّل ويمنع الويدجت يجيب السعر.\n\nبالصفحة اللي تفتح فعّل «السماح بالبيانات أثناء توفير البيانات».",
                          "data", new Runnable() { public void run() { openData(); } });
                  }
              }

              void show(String title, String msg, final String key, final Runnable allow) {
                  dialog = new AlertDialog.Builder(this, android.R.style.Theme_Material_Light_Dialog_Alert)
                      .setTitle(title)
                      .setMessage(msg)
                      .setCancelable(false)
                      .setPositiveButton("سماح", new android.content.DialogInterface.OnClickListener() {
                          public void onClick(android.content.DialogInterface d, int w) { allow.run(); }
                      })
                      .setNegativeButton("لاحقاً", new android.content.DialogInterface.OnClickListener() {
                          public void onClick(android.content.DialogInterface d, int w) { snooze(key); }
                      })
                      .create();
                  dialog.show();
              }

              void openBattery() {
                  try {
                      Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                      i.setData(Uri.parse("package:" + getPackageName()));
                      startActivity(i);
                  } catch (Exception e) {
                      openAppSettings();
                  }
              }

              void openData() {
                  try {
                      Intent i = new Intent(Settings.ACTION_IGNORE_BACKGROUND_DATA_RESTRICTIONS_SETTINGS);
                      i.setData(Uri.parse("package:" + getPackageName()));
                      startActivity(i);
                  } catch (Exception e) {
                      openAppSettings();
                  }
              }

              void openAppSettings() {
                  try {
                      Intent i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                      i.setData(Uri.parse("package:" + getPackageName()));
                      startActivity(i);
                  } catch (Exception ignored) {}
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon
          cp build/outputs/apk/debug/*.apk Price-Gram.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Price Gram v${{ github.run_number }}
          files: Price-Gram.apk
