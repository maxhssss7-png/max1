# Price Gram — ملف واحد يبني كل شي: الصفحة + الأيقونة + التطبيق + الويدجت + التنبيهات
# الكود كله مضغوط داخل هذا الملف حتى يصير صغير وينلصق كامل
name: Price Gram

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml', 'chat.js', 'p2p.js', 'chat.css']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gram-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: What changed
        run: |
          # نسخة تطبيق جديدة بس إذا تغيّر كود التطبيق المضغوط داخل build.yml
          # تغيير chat.js أو p2p.js أو chat.css أو باقي أسطر هذا الملف بس يحدّث الصفحة
          APP=true
          if [ "${{ github.event_name }}" = "push" ] && git rev-parse -q --verify HEAD~1 >/dev/null; then
            if git diff -U0 HEAD~1 HEAD -- .github/workflows/build.yml | grep -qE '^[+-] {10}[A-Za-z0-9+/=]{40,}'; then APP=true; else APP=false; fi
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "build app: $APP"

      - name: Create all files
        run: |
          rm -rf src site
