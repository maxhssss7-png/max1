          cat > site/ton.html << 'EOF'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#2b95f2">
          <title>Price Gram</title>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap">
          <style>
            /* Layout: single column instrument panel — hero price, chart, range, stats grid, converter */
            :root{
              --bg:#1f6fdc; --surface:rgba(255,255,255,.12); --surface-2:rgba(255,255,255,.2); --line:rgba(255,255,255,.2);
              --txt:#ffffff; --sub:rgba(255,255,255,.78); --faint:rgba(255,255,255,.55);
              --accent:#ffffff; --accent-2:#30a1f5; --up:#9dffc8; --down:#ffc7cd;
              --font:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
              --r-lg:24px; --r-md:16px;
            }
            *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
            [hidden]{display:none!important}
            html,body{margin:0;background:#1546b8;color:var(--txt);font-family:var(--font)}
            body{
              min-height:100vh;
              padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px));
              background:
                linear-gradient(180deg,#2b95f2 0%,#1f6fdc 50%,#1546b8 100%);
              background-color:var(--bg);
            }
            .wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
            .num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

            /* Top bar */
            .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
            .brand{display:flex;align-items:center;gap:10px}
            .mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
              background:rgba(255,255,255,.18);box-shadow:0 6px 18px rgba(10,40,120,.25)}
            .mark img{width:100%;height:100%;border-radius:12px;object-fit:cover}
            .brand b{font-size:17px;font-weight:700;letter-spacing:.02em}
            .brand small{display:block;color:var(--sub);font-size:11px;font-weight:400;letter-spacing:.06em}
            .actions{display:flex;align-items:center;gap:8px}
            .live{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;
              background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--sub)}
            .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
            .live.on .dot{background:var(--up);box-shadow:0 0 0 0 rgba(18,168,101,.5);animation:pulse 2s infinite}
            .live.on{color:var(--txt)}
            @keyframes pulse{70%{box-shadow:0 0 0 7px rgba(18,168,101,0)}100%{box-shadow:0 0 0 0 rgba(18,168,101,0)}}
            .icon-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
              color:var(--txt);display:grid;place-items:center;cursor:pointer}
            .icon-btn svg{width:16px;height:16px}
            .icon-btn.spin svg{animation:spin .8s linear}
            @keyframes spin{to{transform:rotate(360deg)}}

            /* Hero */
            .hero{padding:18px 4px 6px}
            .label{color:var(--sub);font-size:13px}
            .price{font-size:clamp(44px,14vw,60px);font-weight:600;line-height:1.05;margin-top:6px;text-align:right;
              transition:color .6s}
            .price.flash-up{color:var(--up);transition:none}
            .price.flash-down{color:var(--down);transition:none}
            .chg{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
            .pill{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:99px;
              font-size:13px;font-weight:600}
            .pill.up{color:#12a865;background:#ffffff}
            .pill.down{color:#d1293a;background:#ffffff}
            .chg .abs{font-size:13px;color:var(--sub)}

            /* Cards */
            .card{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);box-shadow:0 8px 24px rgba(10,40,120,.18);
              border-radius:var(--r-lg);padding:16px}
            .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
            .card-h h2{margin:0;font-size:14px;font-weight:500;color:var(--sub)}

            /* Chart */
            .tabs{display:flex;gap:4px;padding:4px;background:rgba(0,0,0,.12);border-radius:12px;border:1px solid var(--line)}
            .tab{border:0;background:none;color:var(--sub);font:500 12px var(--font);height:28px;padding:0 10px;border-radius:9px;cursor:pointer}
            .tab[aria-pressed="true"]{background:var(--surface-2);color:var(--txt)}
            .scrub{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;min-height:22px}
            .scrub .v{font-size:16px;font-weight:600}
            .scrub .t{font-size:12px;color:var(--sub)}
            .chart-box{position:relative;height:190px;margin:8px -4px 0;touch-action:pan-y}
            canvas{width:100%;height:100%;display:block}
            .chart-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:13px}
            .chart-foot{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--faint)}

            /* Range */
            .range{margin-top:14px}
            .track{position:relative;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--down),#f5c451,var(--up));opacity:.9}
            .knob{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;
              border:3px solid #1f6fdc;transform:translate(-50%,-50%);left:50%;transition:left .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 2px 8px rgba(10,40,120,.4)}
            .range-lbl{display:flex;justify-content:space-between;margin-top:10px;font-size:12px}
            .range-lbl span{color:var(--sub)}
            .range-lbl b{display:block;font-size:14px;font-weight:600;color:var(--txt);margin-top:2px}
            [dir=rtl] .track{transform:scaleX(1)}

            /* Stats */
            .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
            .tile{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);box-shadow:0 4px 14px rgba(10,40,120,.12);border-radius:var(--r-md);padding:14px;min-width:0}
            .tile span{display:block;color:var(--sub);font-size:12px}
            .tile b{display:block;font-size:17px;font-weight:600;margin-top:6px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

            /* Converter */
            .conv{display:flex;flex-direction:column;gap:8px;margin-top:12px}
            .field{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.10);border:1px solid var(--line);border-radius:var(--r-md);padding:0 14px;height:58px;transition:border-color .2s}
            .field:focus-within{border-color:var(--accent)}
            .field input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--txt);font:600 20px var(--font);
              direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
            .field .cur{font-size:13px;font-weight:600;color:var(--sub);background:var(--surface-2);padding:5px 10px;border-radius:8px}
            .swap{align-self:center;margin:-16px 0;z-index:1;width:34px;height:34px;border-radius:50%;background:var(--surface-2);
              border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
            .swap svg{width:16px;height:16px}

            .foot{text-align:center;color:var(--faint);font-size:11px;line-height:1.8;margin-top:4px}
            .err{color:var(--down)}
            button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
            @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

            /* Banners */
            .banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-md);font-size:13px;line-height:1.5}
            .banner.update{background:#ffffff;color:#0b2a4a;box-shadow:0 8px 24px rgba(10,40,120,.25)}
            .banner.update b{display:block;font-size:14px}
            .banner.update .txt{flex:1;min-width:0}
            .banner.offline{background:rgba(0,0,0,.18);border:1px solid var(--line);color:var(--txt)}
            .btn{border:0;border-radius:12px;height:38px;padding:0 16px;font:600 13px var(--font);cursor:pointer;white-space:nowrap}
            .btn.primary{background:#1f6fdc;color:#fff}
            .btn.light{background:#fff;color:#1f6fdc}
            .btn.ghost{background:var(--surface-2);color:var(--txt)}

            /* Chart header */
            .seg{display:flex;gap:2px;padding:3px;background:rgba(0,0,0,.12);border-radius:10px;border:1px solid var(--line)}
            .seg button{border:0;background:none;color:var(--sub);font:500 12px var(--font);height:26px;padding:0 10px;border-radius:8px;cursor:pointer}
            .seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--txt)}
            .tabs.full{margin-top:12px;justify-content:space-between}
            .tabs.full .tab{flex:1}

            /* Portfolio */
            .field{min-width:0}
            .field input{width:100%}
            .pf-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:12px}
            .pf-grid .field{height:54px}
            .pf-grid .field input{font-size:17px}
            .pf-out{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
            .pf-out div{background:rgba(0,0,0,.10);border-radius:12px;padding:10px;min-width:0}
            .pf-out span{display:block;color:var(--sub);font-size:11px}
            .pf-out b{display:block;font-size:15px;font-weight:600;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
            .pf-out small{display:block;font-size:11px;font-weight:500;margin-top:2px;opacity:.9}
            .pos{color:var(--up)} .neg{color:var(--down)}
            .hint{color:var(--faint);font-size:11px;margin-top:8px;line-height:1.6}

            /* Alerts */
            .al-row{display:flex;gap:8px;margin-top:12px}
            .al-row .field{flex:1;min-width:0;height:50px}
            .al-row .field input{font-size:17px}
            .al-row .btn{height:50px}
            .al-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
            .al-item{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.10);border-radius:12px;padding:10px 12px;font-size:13px}
            .al-item .ar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:#fff}
            .al-item .ar.up{color:#12a865} .al-item .ar.down{color:#d1293a}
            .al-item .t{flex:1;min-width:0}
            .al-item .x{border:0;background:var(--surface-2);color:var(--txt);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px}
            .empty{color:var(--faint);font-size:12px;text-align:center;padding:8px 0}

            /* Trades */
            .tr-head,.tr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:12px}
            .tr-head{color:var(--faint);margin-top:10px;padding:0 4px 6px;border-bottom:1px solid var(--line)}
            .tr{padding:6px 4px;font-variant-numeric:tabular-nums;direction:ltr}
            .tr-head{direction:ltr}
            .tr span:nth-child(2),.tr-head span:nth-child(2){text-align:center}
            .tr span:last-child,.tr-head span:last-child{text-align:right;color:var(--sub)}
            .tr.buy span:first-child{color:var(--up)} .tr.sell span:first-child{color:var(--down)}
            .tr.new{animation:flash .8s ease-out}
            @keyframes flash{from{background:rgba(255,255,255,.18)}to{background:transparent}}
            .trades{max-height:330px;overflow:hidden;border-radius:10px}

            .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:#fff;color:#0b2a4a;
              padding:10px 18px;border-radius:99px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(10,40,120,.3);z-index:20;max-width:90%;text-align:center}
          </style>
          </head>
          <body>
          <div class="wrap">

            <header class="top">
              <div class="brand">
                <div class="mark" id="mark"><img src="logo.png" alt=""></div>
                <div><b>PRICE GRAM</b><small>GRAM / USDT</small></div>
              </div>
              <div class="actions">
                <div class="live" id="live"><span class="dot"></span><span id="liveTxt">جاري الاتصال</span></div>
                <button class="icon-btn" id="share" aria-label="مشاركة">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
                </button>
                <button class="icon-btn" id="refresh" aria-label="تحديث">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
                </button>
              </div>
            </header>

            <div class="banner update" id="updBanner" hidden>
              <div class="txt"><b>يوجد تحديث جديد</b><span id="updTxt">نسخة أحدث من Price Gram صارت متوفرة</span></div>
              <button class="btn primary" id="updBtn">تحديث</button>
            </div>

            <div class="banner offline" id="offBanner" hidden>
              <span>⚠</span><span id="offTxt">بدون اتصال · يعرض آخر سعر محفوظ</span>
            </div>

            <section class="hero">
              <div class="label">سعر GRAM الآن · USDT</div>
              <div class="price num" id="price">—</div>
              <div class="chg">
                <span class="pill up" id="pct"><span class="num">—</span></span>
                <span class="abs num" id="abs"></span>
                <span class="abs">خلال 24 ساعة</span>
              </div>
            </section>

            <section class="card">
              <div class="card-h">
                <h2>الحركة</h2>
                <div class="seg" role="group" aria-label="نوع الرسم">
                  <button data-mode="line" aria-pressed="true">خط</button>
                  <button data-mode="candle" aria-pressed="false">شموع</button>
                </div>
              </div>
              <div class="tabs full" role="group" aria-label="المدة">
                <button class="tab" data-r="1H" aria-pressed="false">ساعة</button>
                <button class="tab" data-r="1D" aria-pressed="false">يوم</button>
                <button class="tab" data-r="1W" aria-pressed="true">أسبوع</button>
                <button class="tab" data-r="1M" aria-pressed="false">شهر</button>
                <button class="tab" data-r="1Y" aria-pressed="false">سنة</button>
              </div>
              <div class="scrub"><span class="v num" id="scrubV">—</span><span class="t" id="scrubT"></span></div>
              <div class="chart-box" id="chartBox">
                <canvas id="chart"></canvas>
                <div class="chart-empty" id="chartEmpty">جاري تحميل الرسم…</div>
              </div>
              <div class="chart-foot"><span>المس الرسم واسحب لعرض السعر بأي وقت</span><span id="periodChg" class="num"></span></div>
            </section>

            <section class="card">
              <div class="card-h"><h2>نطاق آخر 24 ساعة</h2></div>
              <div class="range">
                <div class="track" dir="ltr"><div class="knob" id="knob"></div></div>
                <div class="range-lbl" dir="ltr">
                  <div><span>الأدنى</span><b class="num" id="low">—</b></div>
                  <div style="text-align:right"><span>الأعلى</span><b class="num" id="high">—</b></div>
                </div>
              </div>
            </section>

            <section class="card">
              <div class="card-h"><h2>محفظتي</h2></div>
              <div class="pf-grid">
                <label class="field"><input id="pfAmt" type="text" inputmode="decimal" placeholder="0" aria-label="كمية GRAM عندك"><span class="cur">GRAM</span></label>
                <label class="field"><input id="pfBuy" type="text" inputmode="decimal" placeholder="سعر الشراء" aria-label="متوسط سعر الشراء"><span class="cur">$</span></label>
              </div>
              <div class="pf-out">
                <div><span>القيمة الآن</span><b class="num" id="pfVal">—</b></div>
                <div><span>ربح اليوم</span><b class="num" id="pfDay">—</b><small class="num"></small></div>
                <div><span>الربح الكلي</span><b class="num" id="pfTot">—</b><small class="num"></small></div>
              </div>
              <div class="hint">اكتب كم GRAM عندك، وسعر الشراء إذا تريد تعرف ربحك الكلي. تنحفظ بموبايلك بس.</div>
            </section>

            <section class="card">
              <div class="card-h"><h2>نبّهني</h2></div>
              <div class="al-row">
                <label class="field"><input id="alPrice" type="text" inputmode="decimal" placeholder="مثلاً 1.10" aria-label="سعر التنبيه"><span class="cur">$</span></label>
                <button class="btn light" id="alAdd">أضف تنبيه</button>
              </div>
              <div class="al-list" id="alList"></div>
              <div class="hint" id="alHint">إذا السعر اللي تكتبه أعلى من الحالي ينبهك لما يصعد له، وإذا أقل ينبهك لما ينزل له. يجيك إشعار حتى لو التطبيق مسكّر.</div>
            </section>

            <section class="grid">
              <div class="tile"><span>حجم التداول (USDT)</span><b class="num" id="qvol">—</b></div>
              <div class="tile"><span>حجم التداول (GRAM)</span><b class="num" id="vol">—</b></div>
              <div class="tile"><span>سعر الافتتاح</span><b class="num" id="open">—</b></div>
              <div class="tile"><span>عدد الصفقات</span><b class="num" id="trades">—</b></div>
            </section>

            <section class="card">
              <div class="card-h"><h2>آخر الصفقات</h2><span class="hint" style="margin:0">مباشر من Binance</span></div>
              <div class="tr-head"><span>السعر $</span><span>الكمية GRAM</span><span>الوقت</span></div>
              <div class="trades" id="tradeList"><div class="empty">جاري التحميل…</div></div>
            </section>

            <section class="card">
              <div class="card-h"><h2>المحوّل</h2></div>
              <div class="conv">
                <label class="field"><input id="inGram" type="text" inputmode="decimal" value="1" aria-label="كمية GRAM"><span class="cur">GRAM</span></label>
                <div class="swap" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg></div>
                <label class="field"><input id="inUsd" type="text" inputmode="decimal" aria-label="المبلغ بالدولار"><span class="cur">USD</span></label>
              </div>
            </section>

            <div class="foot" id="foot">البيانات من Binance</div>
          </div>
          <div class="toast" id="toast" hidden></div>

          <script>
          (function(){
            "use strict";
            var REMOTE="https://maxhssss7-png.github.io/max1/ton.html";
            var APK="https://github.com/maxhssss7-png/max1/releases/latest/download/Price-Gram.apk";
            var HOSTS=["https://api.binance.com","https://data-api.binance.vision"];
            var WSS=["wss://stream.binance.com:9443/stream?streams=gramusdt@ticker/gramusdt@trade",
                     "wss://data-stream.binance.vision/stream?streams=gramusdt@ticker/gramusdt@trade"];
            var SYM="GRAMUSDT";
            var RANGES={"1H":["1m",60],"1D":["15m",96],"1W":["1h",168],"1M":["4h",180],"1Y":["1d",365]};
            var $=function(id){return document.getElementById(id)};
            var A=window.Android||null;
            var state={price:0,chg:0,pct:0,range:"1W",mode:"line",candles:[],lastSide:"gram",wsIdx:0,lastTick:0,lastSave:0,trades:[],alerts:[]};

            /* ---------- Storage (app store, falls back to browser) ---------- */
            function sget(k){
              try{if(A&&A.get){var v=A.get(k);if(v!=null)return v;}}catch(e){}
              try{return localStorage.getItem(k)}catch(e){return null}
            }
            function sset(k,v){
              try{if(A&&A.set){A.set(k,v);return;}}catch(e){}
              try{localStorage.setItem(k,v)}catch(e){}
            }
            function sjson(k,d){try{var v=sget(k);return v?JSON.parse(v):d}catch(e){return d}}

            var r0=sget("gram.range");if(r0&&RANGES[r0])state.range=r0;
            var m0=sget("gram.mode");if(m0==="line"||m0==="candle")state.mode=m0;

            function toast(t){var el=$("toast");el.textContent=t.replace(/\$[\d.,]+/g,function(m){return "\u2066"+m+"\u2069"});el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},2600)}

            function dec(v){return v>=10?2:v>=1?3:v>=0.01?4:6}
            function money(v){return "$"+v.toLocaleString("en-US",{minimumFractionDigits:dec(v),maximumFractionDigits:dec(v)})}
            function signed(v){return (v>=0?"+":"-")+money(Math.abs(v))}
            function compact(v,prefix){
              var s=v>=1e9?(v/1e9).toFixed(2)+"B":v>=1e6?(v/1e6).toFixed(2)+"M":v>=1e3?(v/1e3).toFixed(1)+"K":v.toFixed(0);
              return (prefix||"")+s;
            }
            function hm(d){return d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}
            function clock(d){return d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
            function fmtTime(ms){
              var d=new Date(ms);
              if(state.range==="1H"||state.range==="1D")return hm(d);
              var day=d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"});
              return state.range==="1Y"?day+" "+d.getFullYear():day+" · "+hm(d);
            }
            function parse(v){v=(v||"").replace(/[٠-٩]/g,function(c){return "٠١٢٣٤٥٦٧٨٩".indexOf(c)}).replace(/[٫,]/g,".");return parseFloat(v)}

            function fetchJSON(url){
              if(/^https?:/.test(url))return fetch(url,{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()});
              var i=0;
              function next(){
                if(i>=HOSTS.length)return Promise.reject(new Error("unreachable"));
                var h=HOSTS[i++];
                return fetch(h+url,{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(next);
              }
              return next();
            }

            /* ---------- Offline ---------- */
            function setOffline(on){
              var last=sjson("gram.last",null);
              $("offBanner").hidden=!on;
              if(on&&last&&last.t)$("offTxt").textContent="بدون اتصال · آخر سعر محفوظ من "+hm(new Date(last.t));
            }
            window.addEventListener("online",function(){
              if(location.protocol==="file:")location.href=REMOTE+"?v="+Date.now();
              else{setOffline(false);refreshAll();}
            });
            window.addEventListener("offline",function(){setOffline(true)});

            /* ---------- Ticker ---------- */
            var scrubbing=false;
            function applyTicker(t,fromCache){
              var p=+t.price, prev=state.price;
              state.price=p;state.chg=+t.chg;state.pct=+t.pct;
              var el=$("price");
              el.textContent=money(p);
              if(prev&&p!==prev&&!fromCache){
                el.classList.remove("flash-up","flash-down");void el.offsetWidth;
                el.classList.add(p>prev?"flash-up":"flash-down");
                setTimeout(function(){el.classList.remove("flash-up","flash-down")},450);
              }
              var up=t.pct>=0,pill=$("pct");
              pill.className="pill "+(up?"up":"down");
              pill.innerHTML='<span class="num">'+(up?"▲ +":"▼ ")+(+t.pct).toFixed(2)+"%</span>";
              $("abs").textContent=signed(+t.chg);
              $("low").textContent=money(+t.low);
              $("high").textContent=money(+t.high);
              var pos=t.high>t.low?(p-t.low)/(t.high-t.low):.5;
              $("knob").style.left=(Math.max(0,Math.min(1,pos))*100)+"%";
              $("qvol").textContent=compact(+t.qvol,"$");
              $("vol").textContent=compact(+t.vol);
              $("open").textContent=money(+t.open);
              $("trades").textContent=Math.round(+t.trades).toLocaleString("en-US");
              if(!scrubbing)$("scrubV").textContent=money(p);
              syncConv();renderPortfolio();
              if(fromCache)return;
              checkAlerts(p);
              state.lastTick=Date.now();
              setOffline(false);
              $("foot").innerHTML="البيانات من Binance · آخر تحديث <span class='num'>"+clock(new Date())+"</span>";
              if(Date.now()-state.lastSave>10000){
                state.lastSave=Date.now();
                t.t=Date.now();sset("gram.last",JSON.stringify(t));
              }
            }

            function loadTicker(){
              return fetchJSON("/api/v3/ticker/24hr?symbol="+SYM).then(function(t){
                applyTicker({price:+t.lastPrice,pct:+t.priceChangePercent,chg:+t.priceChange,low:+t.lowPrice,high:+t.highPrice,
                  qvol:+t.quoteVolume,vol:+t.volume,open:+t.openPrice,trades:+t.count});
              });
            }

            /* ---------- Trades ---------- */
            function renderTrades(fresh){
              var box=$("tradeList");
              if(!state.trades.length){box.innerHTML='<div class="empty">لا توجد صفقات بعد</div>';return;}
              box.innerHTML=state.trades.map(function(t,i){
                return '<div class="tr '+(t.sell?"sell":"buy")+(fresh&&i===0?" new":"")+'"><span>'+t.p.toFixed(dec(t.p))+'</span><span>'+
                  t.q.toLocaleString("en-US",{maximumFractionDigits:2})+'</span><span>'+clock(new Date(t.t))+'</span></div>';
              }).join("");
            }
            function addTrade(t){
              state.trades.unshift(t);
              if(state.trades.length>12)state.trades.length=12;
            }
            var tradeQ=[],tradeTimer=null;
            function queueTrade(t){
              tradeQ.push(t);
              if(tradeTimer)return;
              tradeTimer=setTimeout(function(){
                tradeQ.forEach(addTrade);tradeQ=[];tradeTimer=null;renderTrades(true);
              },400);
            }
            function loadTrades(){
              return fetchJSON("/api/v3/trades?symbol="+SYM+"&limit=12").then(function(a){
                state.trades=a.reverse().map(function(x){return {p:+x.price,q:+x.qty,t:x.time,sell:!!x.isBuyerMaker}});
                renderTrades(false);
              }).catch(function(){if(!state.trades.length)$("tradeList").innerHTML='<div class="empty">تعذر تحميل الصفقات</div>'});
            }

            /* ---------- Live stream ---------- */
            function setLive(on,txt){$("live").classList.toggle("on",on);$("liveTxt").textContent=txt;}
            function connect(){
              if(!("WebSocket" in window)){setLive(false,"تحديث دوري");return;}
              var ws;
              try{ws=new WebSocket(WSS[state.wsIdx%WSS.length]);}catch(e){state.wsIdx++;setTimeout(connect,3000);return;}
              ws.onopen=function(){setLive(true,"مباشر")};
              ws.onmessage=function(m){
                try{
                  var msg=JSON.parse(m.data),d=msg.data||msg;
                  if(d.e==="24hrTicker"){
                    applyTicker({price:+d.c,pct:+d.P,chg:+d.p,low:+d.l,high:+d.h,qvol:+d.q,vol:+d.v,open:+d.o,trades:+d.n});
                  }else if(d.e==="trade"){
                    queueTrade({p:+d.p,q:+d.q,t:d.T,sell:!!d.m});
                  }
                }catch(e){}
              };
              ws.onclose=function(){setLive(false,"إعادة الاتصال");state.wsIdx++;setTimeout(connect,3000)};
              ws.onerror=function(){try{ws.close()}catch(e){}};
            }
            setInterval(function(){if(Date.now()-state.lastTick>20000)loadTicker().catch(function(){});},10000);

            /* ---------- Chart ---------- */
            var cv=$("chart"),ctx=cv.getContext("2d"),hoverIdx=-1;
            function setCandles(k){
              state.candles=k.map(function(c){return {t:c[0],o:+c[1],h:+c[2],l:+c[3],c:+c[4]}});
            }
            function afterChart(){
              var s=state.candles;if(s.length<2)return;
              $("chartEmpty").hidden=true;
              var a=s[0].c,b=s[s.length-1].c,ch=(b-a)/a*100;
              var pc=$("periodChg");pc.textContent=(ch>=0?"+":"")+ch.toFixed(2)+"%";
              pc.style.color=ch>=0?"var(--up)":"var(--down)";
              draw();
            }
            function loadChart(){
              var r=RANGES[state.range],key="gram.k."+state.range;
              var cached=sjson(key,null);
              if(cached&&cached.length){setCandles(cached);afterChart();}
              else{$("chartEmpty").hidden=false;$("chartEmpty").textContent="جاري تحميل الرسم…";}
              return fetchJSON("/api/v3/klines?symbol="+SYM+"&interval="+r[0]+"&limit="+r[1]).then(function(k){
                setCandles(k);afterChart();
                try{sset(key,JSON.stringify(k.map(function(c){return [c[0],c[1],c[2],c[3],c[4]]})))}catch(e){}
              }).catch(function(){if(!state.candles.length)$("chartEmpty").textContent="تعذر تحميل الرسم";});
            }
            function draw(){
              var s=state.candles,dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
              cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
              if(s.length<2)return;
              var candle=state.mode==="candle";
              var min=Infinity,max=-Infinity;
              s.forEach(function(c){var lo=candle?c.l:c.c,hi=candle?c.h:c.c;if(lo<min)min=lo;if(hi>max)max=hi});
              var rg=(max-min)||1,pt=12,pb=10,px=10;
              function X(i){return px+(W-2*px)*i/(s.length-1)}
              function Y(v){return pt+(H-pt-pb)*(1-(v-min)/rg)}
              ctx.strokeStyle="rgba(255,255,255,.10)";ctx.lineWidth=1;
              for(var g=1;g<4;g++){var gy=Math.round(H*g/4)+.5;ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}
              var i;
              if(candle){
                var bw=Math.max(1,(W-2*px)/s.length*0.62);
                for(i=0;i<s.length;i++){
                  var c=s[i],x=X(i),up=c.c>=c.o;
                  ctx.strokeStyle=ctx.fillStyle=up?"#9dffc8":"#ffc7cd";
                  ctx.lineWidth=1;
                  ctx.beginPath();ctx.moveTo(Math.round(x)+.5,Y(c.h));ctx.lineTo(Math.round(x)+.5,Y(c.l));ctx.stroke();
                  var y1=Y(Math.max(c.o,c.c)),y2=Y(Math.min(c.o,c.c));
                  ctx.fillRect(x-bw/2,y1,bw,Math.max(1,y2-y1));
                }
              }else{
                ctx.beginPath();
                for(i=0;i<s.length;i++){i?ctx.lineTo(X(i),Y(s[i].c)):ctx.moveTo(X(i),Y(s[i].c))}
                ctx.lineTo(X(s.length-1),H);ctx.lineTo(X(0),H);ctx.closePath();
                var gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,"rgba(255,255,255,.38)");gr.addColorStop(1,"rgba(255,255,255,0)");
                ctx.fillStyle=gr;ctx.fill();
                ctx.beginPath();
                for(i=0;i<s.length;i++){i?ctx.lineTo(X(i),Y(s[i].c)):ctx.moveTo(X(i),Y(s[i].c))}
                ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.lineJoin="round";ctx.lineCap="round";
                ctx.shadowColor="rgba(10,40,120,.25)";ctx.shadowBlur=6;ctx.stroke();ctx.shadowBlur=0;
              }
              var mi=hoverIdx>=0?hoverIdx:s.length-1,mx=X(mi),my=Y(s[mi].c);
              if(hoverIdx>=0){
                ctx.strokeStyle="rgba(255,255,255,.45)";ctx.setLineDash([3,4]);ctx.lineWidth=1;
                ctx.beginPath();ctx.moveTo(mx,0);ctx.lineTo(mx,H);ctx.stroke();ctx.setLineDash([]);
              }
              ctx.fillStyle="rgba(255,255,255,.25)";ctx.beginPath();ctx.arc(mx,my,9,0,7);ctx.fill();
              ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(mx,my,5,0,7);ctx.fill();
              ctx.fillStyle="#1f6fdc";ctx.beginPath();ctx.arc(mx,my,3,0,7);ctx.fill();
            }
            function scrubAt(clientX){
              var r=cv.getBoundingClientRect(),s=state.candles,n=s.length;if(n<2)return;
              var i=Math.round((clientX-r.left-10)/(r.width-20)*(n-1));i=Math.max(0,Math.min(n-1,i));
              hoverIdx=i;scrubbing=true;
              var c=s[i];
              $("scrubV").textContent=state.mode==="candle"?money(c.c)+"  ↑"+money(c.h)+" ↓"+money(c.l):money(c.c);
              $("scrubT").textContent=fmtTime(c.t);
              draw();
            }
            function endScrub(){hoverIdx=-1;scrubbing=false;$("scrubV").textContent=state.price?money(state.price):"—";$("scrubT").textContent="";draw();}
            var box=$("chartBox");
            box.addEventListener("pointerdown",function(e){scrubAt(e.clientX)});
            box.addEventListener("pointermove",function(e){if(scrubbing||e.pointerType==="mouse")scrubAt(e.clientX)});
            ["pointerup","pointercancel","pointerleave"].forEach(function(ev){box.addEventListener(ev,endScrub)});
            if("ResizeObserver" in window)new ResizeObserver(draw).observe(box);else window.addEventListener("resize",draw);

            function each(sel,fn){Array.prototype.forEach.call(document.querySelectorAll(sel),fn)}
            each(".tab",function(b){
              b.setAttribute("aria-pressed",b.dataset.r===state.range?"true":"false");
              b.addEventListener("click",function(){
                if(state.range===b.dataset.r)return;
                state.range=b.dataset.r;sset("gram.range",state.range);
                each(".tab",function(x){x.setAttribute("aria-pressed",x===b?"true":"false")});
                state.candles=[];loadChart();
              });
            });
            each(".seg button",function(b){
              b.setAttribute("aria-pressed",b.dataset.mode===state.mode?"true":"false");
              b.addEventListener("click",function(){
                state.mode=b.dataset.mode;sset("gram.mode",state.mode);
                each(".seg button",function(x){x.setAttribute("aria-pressed",x===b?"true":"false")});
                draw();
              });
            });

            /* ---------- Converter ---------- */
            function trim(n,max){return n.toLocaleString("en-US",{maximumFractionDigits:max,useGrouping:false})}
            function syncConv(){
              if(!state.price)return;
              if(state.lastSide==="gram"){var g=parse($("inGram").value);$("inUsd").value=isNaN(g)?"":trim(g*state.price,2);}
              else{var u=parse($("inUsd").value);$("inGram").value=isNaN(u)?"":trim(u/state.price,4);}
            }
            $("inGram").addEventListener("input",function(){state.lastSide="gram";syncConv()});
            $("inUsd").addEventListener("input",function(){state.lastSide="usd";syncConv()});

            /* ---------- Portfolio ---------- */
            var pf=sjson("gram.pf",{amt:"",buy:""});
            $("pfAmt").value=pf.amt||"";$("pfBuy").value=pf.buy||"";
            function setPL(el,v,base){
              if(v==null||isNaN(v)){el.textContent="—";el.className="num";if(el.nextElementSibling)el.nextElementSibling.textContent="";return;}
              el.textContent=signed(v);el.className="num "+(v>=0?"pos":"neg");
              var sm=el.nextElementSibling;
              if(sm)sm.textContent=base?(v>=0?"+":"")+(v/base*100).toFixed(1)+"%":"";
            }
            function renderPortfolio(){
              var amt=parse($("pfAmt").value),buy=parse($("pfBuy").value);
              if(!state.price||isNaN(amt)||amt<=0){$("pfVal").textContent="—";setPL($("pfDay"),null);setPL($("pfTot"),null);return;}
              $("pfVal").textContent=money(amt*state.price);
              setPL($("pfDay"),amt*state.chg,amt*(state.price-state.chg));
              if(!isNaN(buy)&&buy>0)setPL($("pfTot"),amt*(state.price-buy),amt*buy);else setPL($("pfTot"),null);
            }
            ["pfAmt","pfBuy"].forEach(function(id){
              $(id).addEventListener("input",function(){
                sset("gram.pf",JSON.stringify({amt:$("pfAmt").value,buy:$("pfBuy").value}));renderPortfolio();
              });
            });

            /* ---------- Alerts ---------- */
            state.alerts=sjson("alerts",[]);
            if(!Array.isArray(state.alerts))state.alerts=[];
            function saveAlerts(){sset("alerts",JSON.stringify(state.alerts));renderAlerts();}
            function renderAlerts(){
              var box=$("alList");
              if(!state.alerts.length){box.innerHTML='<div class="empty">ما عندك تنبيهات</div>';return;}
              box.innerHTML=state.alerts.map(function(a){
                var up=a.dir==="above";
                return '<div class="al-item"><span class="ar '+(up?"up":"down")+'">'+(up?"▲":"▼")+'</span><span class="t">'+
                  (up?"إذا صعد فوق ":"إذا نزل تحت ")+'<b class="num">'+money(a.price)+'</b></span>'+
                  '<button class="x" data-id="'+a.id+'" aria-label="حذف">×</button></div>';
              }).join("");
              each("#alList .x",function(b){b.addEventListener("click",function(){
                var id=+b.dataset.id;state.alerts=state.alerts.filter(function(a){return a.id!==id});saveAlerts();
              })});
            }
            function checkAlerts(p){
              if(!state.alerts.length)return;
              var hit=[],keep=[];
              state.alerts.forEach(function(a){((a.dir==="above"?p>=a.price:p<=a.price)?hit:keep).push(a)});
              if(!hit.length)return;
              state.alerts=keep;saveAlerts();
              hit.forEach(function(a){
                var title=a.dir==="above"?"GRAM صعد فوق "+money(a.price):"GRAM نزل تحت "+money(a.price);
                try{if(A&&A.notify)A.notify(title,"السعر الآن "+money(p));}catch(e){}
                toast(title);
              });
            }
            $("alAdd").addEventListener("click",function(){
              var v=parse($("alPrice").value);
              if(isNaN(v)||v<=0){toast("اكتب سعر صحيح");return;}
              if(!state.price){toast("انتظر يوصل السعر الحالي");return;}
              if(v===state.price){toast("هذا هو السعر الحالي");return;}
              var a={id:Date.now(),price:v,dir:v>state.price?"above":"below"};
              state.alerts.push(a);saveAlerts();
              $("alPrice").value="";
              toast(a.dir==="above"?"راح أنبهك لما يصعد فوق "+money(v):"راح أنبهك لما ينزل تحت "+money(v));
              try{if(A&&A.notifStatus&&A.notifStatus()!=="granted")A.requestNotif();}catch(e){}
            });
            if(!A)$("alHint").textContent="التنبيهات بالإشعارات تشتغل داخل تطبيق Price Gram.";
            renderAlerts();

            /* ---------- Update banner ---------- */
            function checkUpdate(){
              if(!A||!A.versionCode)return;
              var mine=0;try{mine=A.versionCode()}catch(e){return}
              fetchJSON("https://api.github.com/repos/maxhssss7-png/max1/releases/latest").then(function(r){
                var run=parseInt(String(r.tag_name||"").replace(/\D/g,""),10);
                if(run&&run+100>mine){
                  $("updTxt").textContent="النسخة 2."+run+" صارت متوفرة، تتثبت فوق الحالية بدون ما تحذف شي.";
                  $("updBanner").hidden=false;
                }
              }).catch(function(){});
            }
            $("updBtn").addEventListener("click",function(){
              try{if(A&&A.openUrl){A.openUrl(APK);return;}}catch(e){}
              location.href=APK;
            });

            /* ---------- Share ---------- */
            function shareText(){
              var head=state.price?("سعر GRAM الآن "+money(state.price)+"\n"):"";
              return head+"تابع سعر GRAM لحظة بلحظة مع رسم بياني وويدجت على شاشتك، حمّل تطبيق Price Gram مجاناً: "+APK;
            }
            $("share").addEventListener("click",function(){
              var t=shareText();
              try{if(A&&A.share){A.share(t);return;}}catch(e){}
              if(navigator.share){navigator.share({text:t}).catch(function(){});return;}
              try{navigator.clipboard.writeText(t).then(function(){toast("تم نسخ رابط المشاركة")});}catch(e){}
            });

            /* ---------- Start ---------- */
            function refreshAll(){
              return Promise.all([loadTicker(),loadChart(),loadTrades()]).catch(function(){});
            }
            $("refresh").addEventListener("click",function(){
              var b=this;b.classList.remove("spin");void b.offsetWidth;b.classList.add("spin");
              refreshAll();
            });

            var cachedT=sjson("gram.last",null);
            if(cachedT&&cachedT.price)applyTicker(cachedT,true);
            loadTicker().catch(function(){
              setOffline(true);
              if(!cachedT)$("foot").innerHTML="<span class='err'>تعذر الاتصال بـ Binance، تأكد من الإنترنت</span>";
            });
            loadChart();
            loadTrades();
            connect();
            checkUpdate();
            document.addEventListener("visibilitychange",function(){if(!document.hidden){loadTicker().catch(function(){});}});
          })();
          </script>
          </body>
          </html>
