name: Build GRAM App

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml', 'logo.png']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create project files
        run: |
          rm -rf src
          mkdir -p src/main/java/com/ton/price src/main/res/drawable src/main/res/layout src/main/res/xml

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'TonPrice'
          EOF

          cat > build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.5.2' }
          android {
              namespace 'com.ton.price'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.ton.price'
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName '3.0'
              }
          }
          EOF

          cat > src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="GRAM Update"
                  android:icon="@drawable/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".PriceWidget" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > src/main/res/drawable/ic_launcher.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0098EA"
                  android:pathData="M54,4a50,50 0 1,0 0.1,0z" />
              <path android:fillColor="#FFFFFF"
                  android:pathData="M32,36h44l-22,40z" />
              <path android:fillColor="#0098EA"
                  android:pathData="M51,40h6v28l-3,5l-3,-5z" />
          </vector>
          EOF
          if [ -f logo.png ]; then
            rm src/main/res/drawable/ic_launcher.xml
            cp logo.png src/main/res/drawable/ic_launcher.png
          fi

          cat > src/main/res/drawable/widget_bg.xml << 'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#0B0B0F" />
              <corners android:radius="28dp" />
          </shape>
          EOF

          cat > src/main/res/layout/widget.xml << 'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center_vertical"
              android:padding="16dp"
              android:layoutDirection="ltr"
              android:background="@drawable/widget_bg">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical">
                  <ImageView
                      android:id="@+id/logo"
                      android:layout_width="30dp"
                      android:layout_height="30dp"
                      android:src="@drawable/ic_launcher" />
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="8dp"
                      android:text="GRAM"
                      android:textColor="#FFFFFF"
                      android:textSize="16sp"
                      android:textStyle="bold" />
              </LinearLayout>
              <TextView
                  android:id="@+id/price"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="10dp"
                  android:text="..."
                  android:textColor="#FFFFFF"
                  android:textSize="30sp"
                  android:textStyle="bold" />
              <TextView
                  android:id="@+id/change"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:textColor="#8A9BB5"
                  android:textSize="14sp"
                  android:textStyle="bold" />
              <TextView
                  android:id="@+id/time"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:text="اضغط للتحديث"
                  android:textColor="#8A9BB5"
                  android:textSize="11sp" />
          </LinearLayout>
          EOF

          cat > src/main/res/xml/widget_info.xml << 'EOF'
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="140dp"
              android:minHeight="110dp"
              android:targetCellWidth="2"
              android:targetCellHeight="2"
              android:resizeMode="horizontal|vertical"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget"
              android:previewLayout="@layout/widget"
              android:widgetCategory="home_screen" />
          EOF

          cat > src/main/java/com/ton/price/PriceWidget.java << 'EOF'
          package com.ton.price;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.widget.RemoteViews;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class PriceWidget extends AppWidgetProvider {
              static final String API = "https://api.coingecko.com/api/v3/simple/price"
                  + "?ids=the-open-network&vs_currencies=usd&include_24hr_change=true";
              static final String REFRESH = "com.ton.price.REFRESH";

              @Override
              public void onReceive(Context c, Intent i) {
                  String a = i.getAction();
                  if (AppWidgetManager.ACTION_APPWIDGET_UPDATE.equals(a) || REFRESH.equals(a)) {
                      final PendingResult pr = goAsync();
                      final Context app = c.getApplicationContext();
                      new Thread(new Runnable() {
                          public void run() {
                              try { update(app); } finally { pr.finish(); }
                          }
                      }).start();
                  } else {
                      super.onReceive(c, i);
                  }
              }

              static void update(Context c) {
                  RemoteViews rv = new RemoteViews(c.getPackageName(), R.layout.widget);
                  Intent ri = new Intent(c, PriceWidget.class).setAction(REFRESH);
                  rv.setOnClickPendingIntent(R.id.root, PendingIntent.getBroadcast(c, 0, ri,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));
                  Intent oi = new Intent(c, MainActivity.class);
                  rv.setOnClickPendingIntent(R.id.logo, PendingIntent.getActivity(c, 1, oi,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));
                  try {
                      HttpURLConnection con = (HttpURLConnection) new URL(API).openConnection();
                      con.setConnectTimeout(7000);
                      con.setReadTimeout(7000);
                      con.setRequestProperty("User-Agent", "GramUpdateApp");
                      BufferedReader r = new BufferedReader(new InputStreamReader(con.getInputStream(), "UTF-8"));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = r.readLine()) != null) sb.append(line);
                      r.close();
                      JSONObject o = new JSONObject(sb.toString()).getJSONObject("the-open-network");
                      double p = o.getDouble("usd");
                      double ch = o.optDouble("usd_24h_change", 0);
                      rv.setTextViewText(R.id.price, String.format(Locale.US, p < 10 ? "$%,.3f" : "$%,.2f", p));
                      rv.setTextViewText(R.id.change, String.format(Locale.US, "%s%.2f%%", ch >= 0 ? "▲ +" : "▼ ", ch));
                      rv.setTextColor(R.id.change, ch >= 0 ? 0xFF22C55E : 0xFFEF4444);
                      rv.setTextViewText(R.id.time, "تحديث " + new SimpleDateFormat("HH:mm", Locale.US).format(new Date()));
                  } catch (Exception e) {
                      rv.setTextViewText(R.id.time, "لا يوجد اتصال • اضغط للتحديث");
                  }
                  AppWidgetManager.getInstance(c).updateAppWidget(new ComponentName(c, PriceWidget.class), rv);
              }
          }
          EOF

          cat > src/main/java/com/ton/price/MainActivity.java << 'EOF'
          package com.ton.price;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              static final String URL = "https://maxhssss7-png.github.io/max1/ton.html";
              static final String OFFLINE = "<html dir='rtl'><body style='background:#0b1220;color:#fff;"
                  + "font-family:sans-serif;text-align:center;padding-top:40%'>"
                  + "<h2>لا يوجد اتصال بالإنترنت</h2>"
                  + "<button onclick=\"location.href='" + URL + "'\" style='background:#0098ea;color:#fff;"
                  + "border:0;border-radius:12px;padding:14px 32px;font-size:16px'>إعادة المحاولة</button>"
                  + "</body></html>";
              WebView web;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(0xFF0B1220);
                  getWindow().setNavigationBarColor(0xFF0B1220);
                  web = new WebView(this);
                  web.setBackgroundColor(0xFF0B1220);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame()) v.loadDataWithBaseURL(URL, OFFLINE, "text/html", "UTF-8", null);
                      }
                  });
                  setContentView(web);
                  web.loadUrl(URL);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon
          cp build/outputs/apk/debug/*.apk GRAM-Update.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: GRAM Update v${{ github.run_number }}
          files: GRAM-Update.apk
