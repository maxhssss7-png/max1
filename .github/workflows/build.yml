# Price Gram — ملف واحد يبني كل شي: الصفحة + الأيقونة + التطبيق + الويدجت + التنبيهات
# الكود كله مضغوط داخل هذا الملف حتى يصير صغير وينلصق كامل
name: Price Gram

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml', 'chat.js']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gram-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # نسخة تطبيق جديدة بس إذا تغيّر build.yml، وتغيير chat.js بس يحدّث الصفحة
      APP: ${{ github.event_name != 'push' || contains(toJSON(github.event.commits.*.modified), 'build.yml') || contains(toJSON(github.event.commits.*.added), 'build.yml') }}
    steps:
      - uses: actions/checkout@v4

