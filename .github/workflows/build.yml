          cat > src/main/java/com/ton/price/AlertReceiver.java << 'EOF'
          package com.ton.price;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class AlertReceiver extends BroadcastReceiver {
              static final String CHECK = "com.ton.price.ALERT_CHECK";
              static final String CHANNEL = "price_alerts";

              @Override
              public void onReceive(Context c, Intent i) {
                  final Context app = c.getApplicationContext();
                  if (!CHECK.equals(i.getAction())) {
                      reschedule(app);
                      return;
                  }
                  final PendingResult pr = goAsync();
                  new Thread(new Runnable() {
                      public void run() {
                          try { check(app); } catch (Throwable ignored) {} finally { pr.finish(); }
                      }
                  }).start();
              }

              static SharedPreferences store(Context c) {
                  return c.getSharedPreferences("store", Context.MODE_PRIVATE);
              }

              static JSONArray alerts(Context c) {
                  try { return new JSONArray(store(c).getString("alerts", "[]")); } catch (Exception e) { return new JSONArray(); }
              }

              static PendingIntent pi(Context c) {
                  Intent i = new Intent(c, AlertReceiver.class).setAction(CHECK);
                  return PendingIntent.getBroadcast(c, 7, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static void reschedule(Context c) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  if (am == null) return;
                  if (alerts(c).length() == 0) {
                      am.cancel(pi(c));
                      return;
                  }
                  long every = 3 * 60 * 1000L;
                  am.setInexactRepeating(AlarmManager.RTC_WAKEUP, System.currentTimeMillis() + 60 * 1000L, every, pi(c));
              }

              static void check(Context c) throws Exception {
                  JSONArray list = alerts(c);
                  if (list.length() == 0) { reschedule(c); return; }
                  double p = PriceWidget.price();
                  JSONArray keep = new JSONArray();
                  for (int i = 0; i < list.length(); i++) {
                      JSONObject a = list.getJSONObject(i);
                      double target = a.getDouble("price");
                      boolean above = "above".equals(a.optString("dir"));
                      boolean hit = above ? p >= target : p <= target;
                      if (hit) {
                          notify(c, (int) (a.optLong("id", i) % 100000),
                              above ? "GRAM صعد فوق " + PriceWidget.money(target) : "GRAM نزل تحت " + PriceWidget.money(target),
                              "السعر الآن " + PriceWidget.money(p));
                      } else {
                          keep.put(a);
                      }
                  }
                  store(c).edit().putString("alerts", keep.toString()).apply();
                  reschedule(c);
              }

              static void notify(Context c, int id, String title, String body) {
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  Notification.Builder b;
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL, "تنبيهات السعر", NotificationManager.IMPORTANCE_HIGH);
                      nm.createNotificationChannel(ch);
                      b = new Notification.Builder(c, CHANNEL);
                  } else {
                      b = new Notification.Builder(c);
                      b.setPriority(Notification.PRIORITY_HIGH);
                      b.setDefaults(Notification.DEFAULT_ALL);
                  }
                  b.setSmallIcon(R.drawable.ic_fg)
                      .setColor(0xFF1F6FDC)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setAutoCancel(true)
                      .setContentIntent(PriceWidget.openApp(c));
                  try { nm.notify(id, b.build()); } catch (Exception ignored) {}
              }
          }
          EOF

